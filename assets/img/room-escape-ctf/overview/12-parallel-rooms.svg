<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="650" viewBox="0 0 1540 650" role="img" aria-labelledby="title desc">
<title id="title">조사실 병렬 운영 예시</title>
<desc id="desc">공용 대기열은 C팀, D팀 순서다. 조사실 1에서 A팀의 조사가 끝나면 C팀을 배정하고, 실제 입장을 확인한 뒤 조사를 시작한다. 그동안 조사실 2에서는 B팀의 조사가 계속된다. 이후 B팀이 종료하면 D팀이 배정된다. 가로 길이는 실제 시간을 나타내지 않는다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#777" stroke-width="1.2"/></marker></defs>
<style>text {font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#222} </style>
<rect width="1540" height="650" fill="#fff"/>

<text x="60" y="70" font-size="25" font-weight="700" text-anchor="start" style="fill:#222">공용 대기열</text>
<text x="259" y="71" font-size="29" font-weight="700" text-anchor="start" style="fill:#222">C팀</text>
<path d="M331 60 L391 60" fill="none" stroke="#777" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="415" y="71" font-size="29" font-weight="700" text-anchor="start" style="fill:#222">D팀</text>
<path d="M60 112 L1480 112" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="1480" y="159" font-size="21" font-weight="400" text-anchor="end" style="fill:#777">진행 순서 예시</text>
<path d="M212 179 L1480 179" fill="none" stroke="#b6b6b6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="60" y="307" font-size="25" font-weight="700" text-anchor="start" style="fill:#222">조사실 1</text>
<rect x="212" y="250" width="408" height="104" fill="#f2f2f2" stroke="#444" stroke-width="1.6"/>
<text x="416.0" y="294" font-size="30" font-weight="700" text-anchor="middle" style="fill:#222">A팀</text>
<text x="416.0" y="329" font-size="22" font-weight="400" text-anchor="middle" style="fill:#666">조사 중</text>
<rect x="620" y="250" width="235" height="104" fill="#fff" stroke="#888" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="737.5" y="294" font-size="30" font-weight="700" text-anchor="middle" style="fill:#222">C팀</text>
<text x="737.5" y="329" font-size="22" font-weight="400" text-anchor="middle" style="fill:#666">입장 대기</text>
<rect x="855" y="250" width="625" height="104" fill="#f2f2f2" stroke="#444" stroke-width="1.6"/>
<text x="1167.5" y="294" font-size="30" font-weight="700" text-anchor="middle" style="fill:#222">C팀</text>
<text x="1167.5" y="329" font-size="22" font-weight="400" text-anchor="middle" style="fill:#666">조사 중</text>
<text x="620" y="225" font-size="22" font-weight="400" text-anchor="middle" style="fill:#222">A팀 종료</text>
<path d="M620 234 L620 249" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="855" y="225" font-size="22" font-weight="400" text-anchor="middle" style="fill:#222">C팀 입장 확인</text>
<path d="M855 234 L855 249" fill="none" stroke="#777" stroke-width="1.5"/>
<text x="60" y="467" font-size="25" font-weight="700" text-anchor="start" style="fill:#222">조사실 2</text>
<rect x="212" y="410" width="928" height="104" fill="#f2f2f2" stroke="#444" stroke-width="1.6"/>
<text x="676.0" y="454" font-size="30" font-weight="700" text-anchor="middle" style="fill:#222">B팀</text>
<text x="676.0" y="489" font-size="22" font-weight="400" text-anchor="middle" style="fill:#666">조사 중</text>
<rect x="1140" y="410" width="340" height="104" fill="#fff" stroke="#888" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1310.0" y="454" font-size="30" font-weight="700" text-anchor="middle" style="fill:#222">D팀</text>
<text x="1310.0" y="489" font-size="22" font-weight="400" text-anchor="middle" style="fill:#666">입장 대기</text>
<text x="1140" y="385" font-size="22" font-weight="400" text-anchor="middle" style="fill:#222">B팀 종료</text>
<path d="M1140 394 L1140 409" fill="none" stroke="#777" stroke-width="1.5"/>
<path d="M60 564 L1480 564" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="60" y="609" font-size="24" font-weight="400" text-anchor="start" style="fill:#555">타이머는 실제 입장을 확인한 뒤 시작합니다.</text>
</svg>